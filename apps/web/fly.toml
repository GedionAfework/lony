# flyctl deploy from apps/web
# Docs: https://fly.io/docs/

app = "lony-web"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_BASE = "https://lony-api.fly.dev/api/v1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
