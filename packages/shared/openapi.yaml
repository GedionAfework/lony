openapi: 3.0.3
info:
  title: EquiLend API
  version: 0.1.0
  description: Shared peer loan ledger. Phase 2 covers authentication, profile, and friendships.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify:
    post:
      summary: Verify email ownership
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /auth/login:
    post:
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified or account disabled
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
  /me:
    get:
      summary: Current profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid access token
    patch:
      summary: Update profile
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /users/search:
    get:
      summary: Search verified users by email, username, or name
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
  /users/{userID}/block:
    post:
      summary: Block a user and prevent future friend requests
      operationId: blockUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friends:
    get:
      summary: List accepted friends
      operationId: listFriends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsResponse"
  /friend-requests:
    get:
      summary: List incoming friend requests
      operationId: listIncomingFriendRequests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending requests sent to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      summary: Send a friend request by email, username, or user id
      operationId: createFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreate"
      responses:
        "201":
          description: Request created or existing pending request returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
        "409":
          description: Already friends
  /friend-requests/outgoing:
    get:
      summary: List outgoing friend requests
      operationId: listOutgoingFriendRequests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending requests sent by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
  /friend-requests/{id}/accept:
    post:
      summary: Accept a friend request
      operationId: acceptFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Now friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friend-requests/{id}/reject:
    post:
      summary: Reject a friend request
      operationId: rejectFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friendships/{id}/remove:
    post:
      summary: Remove an accepted friendship without deleting loan history
      operationId: removeFriendship
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, display_name, timezone, locale, email_verified, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        default_currency_code: { type: string, nullable: true }
        email_verified: { type: boolean }
        status: { type: string }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
    RegisterResponse:
      type: object
      required: [user, verification_hint]
      properties:
        user: { $ref: "#/components/schemas/User" }
        verification_hint: { type: string }
        verification_code:
          type: string
          description: Present only when APP_ENV=development
    VerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 6, maxLength: 6 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        token_type: { type: string, example: Bearer }
        user: { $ref: "#/components/schemas/User" }
    PatchMeRequest:
      type: object
      properties:
        display_name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        default_currency_code: { type: string }
    UserSearchHit:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        username: { type: string, nullable: true }
    UserSearchResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserSearchHit" }
    Friendship:
      type: object
      required: [id, status, requested_at, peer]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, removed, blocked] }
        requested_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        peer: { $ref: "#/components/schemas/UserSearchHit" }
    FriendshipResponse:
      type: object
      required: [friendship]
      properties:
        friendship: { $ref: "#/components/schemas/Friendship" }
    FriendsResponse:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friendship" }
    FriendRequestsResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/Friendship" }
    FriendRequestCreate:
      type: object
      properties:
        email: { type: string, format: email }
        username: { type: string }
        user_id: { type: string, format: uuid }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
