openapi: 3.0.3
info:
  title: Lony API
  version: 0.1.0
  description: Shared peer loan ledger. Phase 8 adds rate limits, idempotency, balance reconcile reporting, and legal disclaimer acceptance.
servers:
  - url: http://localhost:8080/api/v1
paths:
  /auth/register:
    post:
      summary: Register with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "409":
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify:
    post:
      summary: Verify email ownership
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /auth/login:
    post:
      summary: Sign in
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "403":
          description: Email not verified or account disabled
  /auth/oauth:
    post:
      summary: Sign in with Google or Telegram (WhatsApp is not supported by Meta as consumer OAuth)
      operationId: oauthLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, accepted_disclaimer]
              properties:
                provider: { type: string, enum: [google, telegram] }
                id_token: { type: string, description: Google ID token }
                telegram:
                  type: object
                  additionalProperties: { type: string }
                  description: Telegram Login Widget fields including hash
                accepted_disclaimer: { type: boolean }
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "501":
          description: Unsupported provider (e.g. whatsapp)
  /auth/refresh:
    post:
      summary: Rotate refresh token and issue a new access token
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/logout:
    post:
      summary: Revoke the current session
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Signed out
  /me:
    get:
      summary: Current profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Missing or invalid access token
    patch:
      summary: Update profile
      operationId: patchMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMeRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /me/avatar:
    post:
      summary: Upload profile photo
      operationId: uploadAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachment_base64]
              properties:
                filename: { type: string }
                mime: { type: string }
                attachment_base64: { type: string }
      responses:
        "200":
          description: Profile with avatar_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /me/export:
    get:
      summary: Export account data (GDPR-style)
      operationId: exportMyData
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, zip], default: zip }
      responses:
        "200":
          description: Zip attachment or JSON export payload
  /me/delete:
    post:
      summary: Soft-delete account (redact PII, revoke sessions)
      operationId: deleteMyAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "Must be DELETE" }
      responses:
        "200":
          description: Account deleted
        "422":
          description: Confirmation missing
  /users/search:
    get:
      summary: Search verified users by email, username, or name
      operationId: searchUsers
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
      responses:
        "200":
          description: Matching users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchResponse"
  /users/{userID}/block:
    post:
      summary: Block a user and prevent future friend requests
      operationId: blockUser
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friends:
    get:
      summary: List accepted friends
      operationId: listFriends
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accepted connections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendsResponse"
  /friend-requests:
    get:
      summary: List incoming friend requests
      operationId: listIncomingFriendRequests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending requests sent to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
    post:
      summary: Send a friend request by email, username, or user id
      operationId: createFriendRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreate"
      responses:
        "201":
          description: Request created or existing pending request returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
        "409":
          description: Already friends
  /friend-requests/outgoing:
    get:
      summary: List outgoing friend requests
      operationId: listOutgoingFriendRequests
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pending requests sent by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendRequestsResponse"
  /friend-requests/{id}/accept:
    post:
      summary: Accept a friend request
      operationId: acceptFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Now friends
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friend-requests/{id}/reject:
    post:
      summary: Reject a friend request
      operationId: rejectFriendRequest
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /friendships/{id}/remove:
    post:
      summary: Remove an accepted friendship without deleting loan history
      operationId: removeFriendship
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /dashboard:
    get:
      summary: Currency-grouped balances and action cards
      operationId: getDashboard
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard; no cross-currency total is returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /loans:
    get:
      summary: List loans for the current user
      operationId: listLoans
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, active, overdue, rejected, cancelled, completed] }
        - in: query
          name: role
          schema: { type: string, enum: [borrower, lender] }
        - in: query
          name: currency
          schema: { type: string, enum: [ETB, USD] }
        - in: query
          name: filter
          schema: { type: string, enum: [receivables, payables, due_soon, pending_action, pending_confirmations] }
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoansResponse"
    post:
      summary: Create a loan request, optionally with terms
      operationId: createLoan
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
      responses:
        "201":
          description: Loan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "403":
          description: Not accepted friends
  /loans/{id}:
    get:
      summary: Loan details, terms history, and timeline
      operationId: getLoan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Loan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "404":
          description: Not found or not a party
  /loans/{id}/terms:
    post:
      summary: Propose or replace pending terms
      operationId: proposeLoanTerms
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanTermsRequest"
      responses:
        "200":
          description: Terms proposed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "409":
          description: Loan is not pending
  /loans/{id}/accept:
    post:
      summary: Accept the current proposed terms
      operationId: acceptLoan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptLoanRequest"
      responses:
        "200":
          description: Loan is now active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "409":
          description: Invalid state
        "422":
          description: Disclaimer not accepted
  /loans/{id}/reject:
    post:
      summary: Reject a pending loan
      operationId: rejectLoan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "409":
          description: Invalid state
  /loans/{id}/cancel:
    post:
      summary: Cancel a pending loan
      operationId: cancelLoan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanResponse"
        "409":
          description: Invalid state
  /loans/{id}/payment-profile:
    get:
      summary: Masked payment profile shared with the borrower for this loan
      operationId: getLoanPaymentProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: reveal
          schema: { type: boolean }
          description: Decrypt the account identifier. Requires recent authentication.
      responses:
        "200":
          description: Payment profile; account_identifier only when reveal=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
        "403":
          description: Recent authentication required to reveal
        "404":
          description: No active share or not the borrower
  /bank-profiles:
    get:
      summary: List the current user's payment profiles (last4 only)
      operationId: listBankProfiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: include_archived
          schema: { type: boolean }
      responses:
        "200":
          description: Profiles without full account identifiers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfilesResponse"
    post:
      summary: Create an encrypted payment profile
      operationId: createBankProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBankProfileRequest"
      responses:
        "201":
          description: Created; response never includes the full identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
  /bank-profiles/{id}:
    get:
      summary: Get a payment profile the caller owns or has an active share for
      operationId: getBankProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: reveal
          schema: { type: boolean }
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
        "403":
          description: Recent authentication required to reveal
        "404":
          description: Not found or unauthorized
    patch:
      summary: Update label, type, institution, currency, or identifier
      operationId: patchBankProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchBankProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
  /bank-profiles/{id}/archive:
    post:
      summary: Archive a payment profile
      operationId: archiveBankProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
  /bank-profiles/{id}/preferred:
    post:
      summary: Mark this as the only preferred profile
      operationId: preferBankProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Preferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileResponse"
  /bank-profiles/{id}/share:
    post:
      summary: Share a profile with a friend, optionally scoped to a loan
      operationId: shareBankProfile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareBankProfileRequest"
      responses:
        "200":
          description: Share created or already active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileShareResponse"
        "403":
          description: Not friends, or not the lender on the loan
  /bank-profiles/{id}/events:
    get:
      summary: Audit events for a profile the caller owns (no full identifiers)
      operationId: listBankProfileEvents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileEventsResponse"
  /bank-profile-shares:
    get:
      summary: List outgoing or incoming payment-profile shares
      operationId: listBankProfileShares
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: direction
          schema: { type: string, enum: [outgoing, incoming] }
      responses:
        "200":
          description: Shares with masked profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileSharesResponse"
  /bank-profile-shares/{id}/revoke:
    post:
      summary: Revoke a share immediately
      operationId: revokeBankProfileShare
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankProfileShareResponse"
        "404":
          description: Not found or not the owner
  /loans/{id}/repayments:
    get:
      summary: List repayment claims for a loan
      operationId: listLoanRepayments
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Repayments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentsResponse"
    post:
      summary: Borrower claims a repayment (default amount = outstanding)
      operationId: claimRepayment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRepaymentRequest"
      responses:
        "201":
          description: Claim created; loan becomes repayment_pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentResponse"
        "403":
          description: Not the borrower
        "409":
          description: Pending claim exists or amount exceeds outstanding
  /repayments/{id}/confirm:
    post:
      summary: Lender confirms a repayment claim
      operationId: confirmRepayment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Confirmed; loan completed when outstanding is zero
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentResponse"
        "403":
          description: Not the lender, or borrower confirming own claim
        "409":
          description: Not pending
  /repayments/{id}/reject:
    post:
      summary: Lender rejects a repayment claim with a reason
      operationId: rejectRepayment
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRepaymentRequest"
      responses:
        "200":
          description: Rejected; loan returns to active or overdue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentResponse"
        "403":
          description: Not the lender
        "409":
          description: Not pending
  /notifications:
    get:
      summary: In-app notification inbox
      operationId: listNotifications
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: unread
          schema: { type: boolean }
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsResponse"
  /notifications/read-all:
    post:
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cleared
  /notifications/{id}/read:
    post:
      summary: Mark one notification as read
      operationId: markNotificationRead
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationResponse"
        "404":
          description: Not found
  /device-tokens:
    post:
      summary: Register a push device token
      operationId: registerDeviceToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"
  /conversations:
    get:
      summary: List DM and loan chat threads
      operationId: listConversations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items: { $ref: "#/components/schemas/Conversation" }
    post:
      summary: Open a friend DM or loan-scoped chat
      operationId: openConversation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                peer_id: { type: string, format: uuid }
                loan_id: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation opened
          content:
            application/json:
              schema:
                type: object
                required: [conversation]
                properties:
                  conversation: { $ref: "#/components/schemas/Conversation" }
  /conversations/{id}/messages:
    get:
      summary: List messages in a conversation
      operationId: listMessages
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatMessage" }
    post:
      summary: Send a message (text and/or attachment)
      operationId: sendMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                reply_to_message_id: { type: string, format: uuid }
                attachment_kind: { type: string, enum: [none, image, file, voice] }
                attachment_name: { type: string }
                attachment_mime: { type: string }
                attachment_base64: { type: string }
                voice_duration_ms: { type: integer }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/ChatMessage" }
  /messages/{id}/reactions:
    post:
      summary: Add or remove a reaction
      operationId: reactMessage
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string }
                remove: { type: boolean }
      responses:
        "200":
          description: Updated message
  /messages/{id}:
    delete:
      summary: Soft-delete own message
      operationId: deleteMessage
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted
  /media/{key}:
    get:
      summary: Download media if the caller is authorized
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: key
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Binary file
        "404":
          description: Not found or forbidden

  /accounts:
    get:
      summary: List money accounts
      operationId: listAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Accounts
    post:
      summary: Create money account
      operationId: createAccount
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /accounts/reconcile:
    get:
      summary: Reconcile all account balances vs ledger
      operationId: reconcileAccounts
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Stated vs expected balance for each account
  /accounts/{id}/reconcile:
    get:
      summary: Reconcile one account balance vs ledger
      operationId: reconcileAccount
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Stated vs expected balance
        "404":
          description: Not found
  /wealth:
    get:
      summary: Net worth summary by currency
      operationId: getWealth
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Wealth summary
  /goals:
    get:
      summary: List goals
      operationId: listGoals
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Goals
    post:
      summary: Create goal
      operationId: createGoal
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Created
  /insights/overview:
    get:
      summary: Cashflow / debt overview metrics
      operationId: insightsOverview
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: currency
          schema: { type: string }
      responses:
        "200":
          description: Overview
  /score:
    get:
      summary: Lony Trust grade (A–E)
      operationId: getScore
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: currency
          required: true
          schema: { type: string }
        - in: query
          name: refresh
          schema: { type: string }
      responses:
        "200":
          description: Trust snapshot with grade, band, components
  /users/{userID}/trust:
    get:
      summary: Friend-visible Trust grade
      operationId: getPeerTrust
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: userID
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public trust grade
        "403":
          description: Not friends
  /ai/insights:
    get:
      summary: List AI insight cards
      operationId: listAIInsights
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Insights + disclaimer
  /ai/insights/refresh:
    post:
      summary: Recompute rule-based insights
      operationId: refreshAIInsights
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Insights
        "503":
          description: AI disabled
  /ai/insights/clear:
    post:
      summary: Dismiss all AI insights for the caller
      operationId: clearAIInsights
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cleared
  /ai/coach/messages:
    post:
      summary: Ask the financial coach
      operationId: aiCoach
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Coach reply + disclaimer
  /admin/overview:
    get:
      summary: Platform KPIs (admin)
      operationId: adminOverview
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Overview
        "403":
          description: Not admin
  /admin/users:
    get:
      summary: Search users (admin)
      operationId: adminListUsers
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User page
  /admin/settings:
    get:
      summary: Platform settings (admin)
      operationId: adminGetSettings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Settings including ai_disabled
  /admin/settings/ai:
    post:
      summary: Enable or disable AI globally
      operationId: adminSetAI
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ai_disabled: { type: boolean }
      responses:
        "200":
          description: Updated settings

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 100 }
      description: Optional replay key for state-changing POSTs
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, display_name, timezone, locale, email_verified, status, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        username: { type: string, nullable: true }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        timezone: { type: string }
        locale: { type: string }
        default_currency_code: { type: string, nullable: true }
        email_verified: { type: boolean }
        status: { type: string }
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    RegisterRequest:
      type: object
      required: [email, password, display_name, accepted_disclaimer]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        display_name: { type: string }
        accepted_disclaimer:
          type: boolean
          description: Must be true; acknowledges Lony is a ledger, not a bank or escrow
    RegisterResponse:
      type: object
      required: [user, verification_hint]
      properties:
        user: { $ref: "#/components/schemas/User" }
        verification_hint: { type: string }
        verification_code:
          type: string
          description: Present only when APP_ENV=development
    VerifyRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, minLength: 6, maxLength: 6 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    TokenResponse:
      type: object
      required: [access_token, refresh_token, expires_in, token_type, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
        token_type: { type: string, example: Bearer }
        user: { $ref: "#/components/schemas/User" }
    PatchMeRequest:
      type: object
      properties:
        display_name: { type: string }
        timezone: { type: string }
        locale: { type: string }
        default_currency_code: { type: string }
    UserSearchHit:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        username: { type: string, nullable: true }
    UserSearchResponse:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/UserSearchHit" }
    Friendship:
      type: object
      required: [id, status, requested_at, peer]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, rejected, removed, blocked] }
        requested_at: { type: string, format: date-time }
        accepted_at: { type: string, format: date-time, nullable: true }
        peer: { $ref: "#/components/schemas/UserSearchHit" }
    FriendshipResponse:
      type: object
      required: [friendship]
      properties:
        friendship: { $ref: "#/components/schemas/Friendship" }
    FriendsResponse:
      type: object
      required: [friends]
      properties:
        friends:
          type: array
          items: { $ref: "#/components/schemas/Friendship" }
    FriendRequestsResponse:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/Friendship" }
    FriendRequestCreate:
      type: object
      properties:
        email: { type: string, format: email }
        username: { type: string }
        user_id: { type: string, format: uuid }
    CreateLoanRequest:
      type: object
      required: [counterparty_id, role]
      properties:
        counterparty_id: { type: string, format: uuid }
        role: { type: string, enum: [borrower, lender] }
        principal: { type: string, description: Decimal string, e.g. "1000.0000" }
        currency_code: { type: string, enum: [ETB, USD] }
        interest_rate_percent: { type: string }
        due_at: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
    LoanTermsRequest:
      type: object
      required: [principal, currency_code, interest_rate_percent, due_at]
      properties:
        principal: { type: string }
        currency_code: { type: string, enum: [ETB, USD] }
        interest_rate_percent: { type: string }
        due_at: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
    AcceptLoanRequest:
      type: object
      required: [accepted_disclaimer]
      properties:
        accepted_disclaimer:
          type: boolean
          description: Must be true; acknowledges Lony is a ledger, not a bank or escrow
    LoanParty:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
        username: { type: string, nullable: true }
    LoanTerms:
      type: object
      required: [id, version, status, interest_basis, principal, currency_code, interest_rate_percent, interest_amount, expected_total, due_at, proposed_by_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [proposed, accepted, superseded] }
        interest_basis: { type: string, example: flat_percent }
        principal: { type: string }
        currency_code: { type: string }
        interest_rate_percent: { type: string }
        interest_amount: { type: string }
        expected_total: { type: string }
        due_at: { type: string, format: date-time }
        note: { type: string, nullable: true }
        proposed_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    LoanEvent:
      type: object
      required: [id, event_type, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        actor_id: { type: string, format: uuid, nullable: true }
        payload: { type: object }
        created_at: { type: string, format: date-time }
    Loan:
      type: object
      required: [id, reference_code, status, borrower, lender, your_role, interest_basis, created_at, can_accept, can_reject, can_cancel, can_propose_terms]
      properties:
        id: { type: string, format: uuid }
        reference_code: { type: string }
        status: { type: string, enum: [pending, active, overdue, repayment_pending, rejected, cancelled, completed] }
        borrower: { $ref: "#/components/schemas/LoanParty" }
        lender: { $ref: "#/components/schemas/LoanParty" }
        your_role: { type: string, enum: [borrower, lender] }
        interest_basis: { type: string, example: flat_percent }
        principal: { type: string, nullable: true }
        currency_code: { type: string, nullable: true }
        interest_rate_percent: { type: string, nullable: true }
        interest_amount: { type: string, nullable: true }
        expected_total: { type: string, nullable: true }
        due_at: { type: string, format: date-time, nullable: true }
        note: { type: string, nullable: true }
        terms_version: { type: integer, nullable: true }
        proposed_by_user_id: { type: string, format: uuid, nullable: true }
        awaiting_user_id: { type: string, format: uuid, nullable: true }
        accepted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        can_accept: { type: boolean }
        can_reject: { type: boolean }
        can_cancel: { type: boolean }
        can_propose_terms: { type: boolean }
        terms:
          type: array
          items: { $ref: "#/components/schemas/LoanTerms" }
        events:
          type: array
          items: { $ref: "#/components/schemas/LoanEvent" }
    LoanResponse:
      type: object
      required: [loan]
      properties:
        loan: { $ref: "#/components/schemas/Loan" }
    LoansResponse:
      type: object
      required: [loans]
      properties:
        loans:
          type: array
          items: { $ref: "#/components/schemas/Loan" }
    DashboardFriendBalance:
      type: object
      required: [peer, receivables, payables, net]
      properties:
        peer: { $ref: "#/components/schemas/LoanParty" }
        receivables: { type: string }
        payables: { type: string }
        net: { type: string }
    DashboardCurrency:
      type: object
      required: [currency_code, receivables, payables, net, due_soon, due_soon_count, pending_requests, open_loan_count, friends]
      properties:
        currency_code: { type: string, enum: [ETB, USD] }
        receivables: { type: string }
        payables: { type: string }
        net: { type: string }
        due_soon: { type: string }
        due_soon_count: { type: integer }
        pending_requests: { type: integer }
        open_loan_count: { type: integer }
        friends:
          type: array
          items: { $ref: "#/components/schemas/DashboardFriendBalance" }
    Dashboard:
      type: object
      required: [pending_requests, pending_confirmations, by_currency]
      properties:
        pending_requests: { type: integer }
        pending_confirmations: { type: integer }
        by_currency:
          type: array
          items: { $ref: "#/components/schemas/DashboardCurrency" }
    DashboardResponse:
      type: object
      required: [dashboard]
      properties:
        dashboard: { $ref: "#/components/schemas/Dashboard" }
    CreateBankProfileRequest:
      type: object
      required: [profile_type, label, account_identifier]
      properties:
        profile_type: { type: string, enum: [bank_account, mobile_wallet, other] }
        label: { type: string, maxLength: 120 }
        institution_name: { type: string, maxLength: 120 }
        account_identifier: { type: string, minLength: 4, maxLength: 64 }
        currency_code: { type: string, enum: [ETB, USD] }
        is_preferred: { type: boolean }
    PatchBankProfileRequest:
      type: object
      properties:
        profile_type: { type: string, enum: [bank_account, mobile_wallet, other] }
        label: { type: string, maxLength: 120 }
        institution_name: { type: string, maxLength: 120 }
        account_identifier: { type: string, minLength: 4, maxLength: 64 }
        currency_code: { type: string, enum: [ETB, USD] }
    ShareBankProfileRequest:
      type: object
      required: [recipient_id]
      properties:
        recipient_id: { type: string, format: uuid }
        loan_id: { type: string, format: uuid }
    BankProfile:
      type: object
      required: [id, profile_type, label, account_last4, is_preferred, created_at, can_reveal]
      properties:
        id: { type: string, format: uuid }
        profile_type: { type: string, enum: [bank_account, mobile_wallet, other] }
        label: { type: string }
        institution_name: { type: string, nullable: true }
        account_last4: { type: string }
        currency_code: { type: string, nullable: true }
        is_preferred: { type: boolean }
        archived_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        account_identifier:
          type: string
          description: Present only after an authorized reveal with recent authentication
        can_reveal: { type: boolean }
    BankProfileShare:
      type: object
      required: [id, profile, owner_id, recipient_id, created_at]
      properties:
        id: { type: string, format: uuid }
        profile: { $ref: "#/components/schemas/BankProfile" }
        owner_id: { type: string, format: uuid }
        recipient_id: { type: string, format: uuid }
        loan_id: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
    BankProfileEvent:
      type: object
      required: [id, event_type, payload, created_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        share_id: { type: string, format: uuid, nullable: true }
        actor_id: { type: string, format: uuid, nullable: true }
        payload: { type: object }
        created_at: { type: string, format: date-time }
    BankProfileResponse:
      type: object
      required: [bank_profile]
      properties:
        bank_profile: { $ref: "#/components/schemas/BankProfile" }
    BankProfilesResponse:
      type: object
      required: [bank_profiles]
      properties:
        bank_profiles:
          type: array
          items: { $ref: "#/components/schemas/BankProfile" }
    BankProfileShareResponse:
      type: object
      required: [share]
      properties:
        share: { $ref: "#/components/schemas/BankProfileShare" }
    BankProfileSharesResponse:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/BankProfileShare" }
    BankProfileEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/BankProfileEvent" }
    ClaimRepaymentRequest:
      type: object
      properties:
        amount: { type: string, description: Defaults to outstanding balance }
        note: { type: string, maxLength: 500 }
        proof_filename: { type: string }
        proof_mime: { type: string }
        proof_base64: { type: string, description: Optional receipt / proof upload }
    RejectRepaymentRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 500 }
    Repayment:
      type: object
      required: [id, loan_id, submitted_by_user_id, amount, status, submitted_at, created_at, can_confirm, can_reject]
      properties:
        id: { type: string, format: uuid }
        loan_id: { type: string, format: uuid }
        submitted_by_user_id: { type: string, format: uuid }
        amount: { type: string }
        status: { type: string, enum: [pending, confirmed, rejected, cancelled] }
        note: { type: string, nullable: true }
        submitted_at: { type: string, format: date-time }
        confirmed_by_user_id: { type: string, format: uuid, nullable: true }
        confirmed_at: { type: string, format: date-time, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        can_confirm: { type: boolean }
        can_reject: { type: boolean }
        proof_url: { type: string, nullable: true }
        proof_name: { type: string, nullable: true }
    RepaymentResponse:
      type: object
      required: [repayment]
      properties:
        repayment: { $ref: "#/components/schemas/Repayment" }
    RepaymentsResponse:
      type: object
      required: [repayments]
      properties:
        repayments:
          type: array
          items: { $ref: "#/components/schemas/Repayment" }
    Notification:
      type: object
      required: [id, type, title, body, payload, push_status, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        loan_id: { type: string, format: uuid, nullable: true }
        title: { type: string }
        body: { type: string }
        payload: { type: object }
        push_status: { type: string, enum: [pending, sent, skipped, failed] }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    NotificationResponse:
      type: object
      required: [notification]
      properties:
        notification: { $ref: "#/components/schemas/Notification" }
    NotificationsResponse:
      type: object
      required: [notifications, unread_count]
      properties:
        notifications:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        unread_count: { type: integer }
    DeviceTokenRequest:
      type: object
      required: [platform, token]
      properties:
        platform: { type: string, enum: [ios, android, web] }
        token: { type: string }
    DeviceToken:
      type: object
      required: [id, platform, token, enabled, last_seen_at, created_at]
      properties:
        id: { type: string, format: uuid }
        platform: { type: string }
        token: { type: string }
        enabled: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    DeviceTokenResponse:
      type: object
      required: [device_token]
      properties:
        device_token: { $ref: "#/components/schemas/DeviceToken" }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fields:
              type: object
              additionalProperties: { type: string }
    Conversation:
      type: object
      required: [id, peer, unread_count, created_at]
      properties:
        id: { type: string, format: uuid }
        peer:
          type: object
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: string }
        loan_id: { type: string, format: uuid, nullable: true }
        last_message_preview: { type: string }
        last_message_at: { type: string, format: date-time, nullable: true }
        unread_count: { type: integer }
        created_at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, conversation_id, sender_id, mine, attachment_kind, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id: { type: string, format: uuid }
        mine: { type: boolean }
        body: { type: string, nullable: true }
        attachment_kind: { type: string }
        attachment_name: { type: string, nullable: true }
        attachment_mime: { type: string, nullable: true }
        attachment_url: { type: string, nullable: true }
        voice_duration_ms: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
